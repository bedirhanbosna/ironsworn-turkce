server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Büyük PDF'ler (Rulebook ~40MB) sorunsuz servis edilsin
    sendfile on;
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Hash'li, değişmez build varlıkları — uzun önbellek
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker güncel kalsın (önbelleğe alınmasın)
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback (adapter-static, dinamik rotalar index.html'e döner)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
