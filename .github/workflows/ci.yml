name: CI

# Yalnızca PR'larda derleme + tip denetimi (main push'unda Docker workflow'u derler).
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Derle (copy-data + vite build)
        run: npm run build

      - name: Tip denetimi (svelte-check)
        run: npm run check
